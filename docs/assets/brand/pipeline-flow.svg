<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">LitNexus 文献流程</title>
  <desc id="desc">用户、LitNexus 与 Europe PMC 之间的检索、筛选与复筛交互</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9eabb5"/>
    </marker>
    <style>
      .actor { fill: #546e7a; stroke: #ffffff; stroke-width: 1.5; }
      .actor-t { fill: #ffffff; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
      .life { stroke: #7a8b99; stroke-width: 2.75; fill: none; }
      .msg { stroke: #9eabb5; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .msg-dash { stroke: #9eabb5; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .msg-t { fill: #c5ced6; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .note { fill: #607d8b; stroke: none; }
      .note-t { fill: #ffffff; font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Lifelines: 用户 x=120, LitNexus x=360, Europe PMC x=600 -->
  <line class="life" x1="120" y1="72" x2="120" y2="468"/>
  <line class="life" x1="360" y1="72" x2="360" y2="468"/>
  <line class="life" x1="600" y1="72" x2="600" y2="468"/>

  <!-- Top actors -->
  <rect class="actor" x="50" y="20" width="140" height="52" rx="6"/>
  <text class="actor-t" x="120" y="46">用户</text>
  <rect class="actor" x="290" y="20" width="140" height="52" rx="6"/>
  <text class="actor-t" x="360" y="46">LitNexus</text>
  <rect class="actor" x="530" y="20" width="140" height="52" rx="6"/>
  <text class="actor-t" x="600" y="46">Europe PMC</text>

  <!-- 1. A → B 配置检索并运行 -->
  <text class="msg-t" x="240" y="108">配置检索并运行</text>
  <line class="msg" x1="128" y1="118" x2="352" y2="118"/>

  <!-- 2. B → C API 检索 -->
  <text class="msg-t" x="480" y="158">API 检索</text>
  <line class="msg" x1="368" y1="168" x2="592" y2="168"/>

  <!-- 3. C -->> B 返回元数据 -->
  <text class="msg-t" x="480" y="208">返回文献元数据</text>
  <line class="msg-dash" x1="592" y1="218" x2="368" y2="218"/>

  <!-- Note over B -->
  <rect class="note" x="250" y="240" width="220" height="40" rx="4"/>
  <text class="note-t" x="360" y="260">合并去重 · AI 初筛 · 写入本地库</text>

  <!-- 4. B → A 导出 CSV -->
  <text class="msg-t" x="240" y="318">导出 CSV</text>
  <line class="msg" x1="352" y1="328" x2="128" y2="328"/>

  <!-- Note over A -->
  <rect class="note" x="20" y="350" width="200" height="40" rx="4"/>
  <text class="note-t" x="120" y="370">基于初筛结果人工阅览、复筛</text>

  <!-- 5. A → B 导回复筛 -->
  <text class="msg-t" x="240" y="428">导回复筛结果</text>
  <line class="msg" x1="128" y1="438" x2="352" y2="438"/>

  <!-- Bottom actors -->
  <rect class="actor" x="50" y="468" width="140" height="52" rx="6"/>
  <text class="actor-t" x="120" y="494">用户</text>
  <rect class="actor" x="290" y="468" width="140" height="52" rx="6"/>
  <text class="actor-t" x="360" y="494">LitNexus</text>
  <rect class="actor" x="530" y="468" width="140" height="52" rx="6"/>
  <text class="actor-t" x="600" y="494">Europe PMC</text>
</svg>
