site_name: LitNexus
site_description: LitNexus - 文献发现与筛选流水线
site_url: https://kiancai.github.io/LitNexus/
repo_url: https://github.com/kiancai/LitNexus
repo_name: kiancai/LitNexus

docs_dir: docs
site_dir: site
hooks:
  - .github/scripts/docs_redirects.py
exclude_docs: |
  start/showcase.md
  start/showcase.en.md

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/brand/litnexus-mark.png
  favicon: assets/brand/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: red
      toggle:
        icon: material/lightbulb
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/lightbulb-outline
        name: 切换到浅色模式

  font: false
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
          link: /
        - locale: en
          name: English
          build: true
          link: /en/
          site_description: LitNexus - literature discovery and screening workflow
          theme:
            language: en
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: brown
                accent: red
                toggle:
                  icon: material/lightbulb
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: black
                accent: light blue
                toggle:
                  icon: material/lightbulb-outline
                  name: Switch to light mode
          nav:
            - Overview: index.md
            - Get started:
                - Installation & quick start: start/quickstart.md
                - FAQ: start/faq.md
            - Guides:
                - Initial setup: guide/setup.md
                - Workspace: guide/workspace.md
                - Run: guide/run.md
                - Data: guide/data.md
                - Statistics: guide/statistics.md
                - Settings: guide/settings.md
                - Search queries: guide/retrieval.md
                - Manual review & CSV import: guide/manual-review.md
                - Page help: guide/page-help.md
            - Concepts & reference:
                - Product overview & motivation: reference/product.md
                - Scope & boundaries: reference/scope.md
                - Pipeline & data flow: reference/pipeline.md
                - Workspace & configuration: reference/workspace.md
                - Database: reference/database.md
            - Development & progress:
                - Architecture overview: develop/architecture.md
                - Platform strategy: develop/platforms.md
                - Roadmap: develop/roadmap.md
                - Feature backlog: develop/backlog.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kiancai/LitNexus
      name: GitHub

extra_css:
  - assets/stylesheets/typography.css

extra_javascript:
  - assets/javascripts/platform-tab.js

nav:
  - 概览: index.md
  - 开始使用:
      - 快速上手: start/quickstart.md
      - 常见问题: start/faq.md
  - 使用指南:
      - 首次设置: guide/setup.md
      - 工作区: guide/workspace.md
      - 运行: guide/run.md
      - 数据: guide/data.md
      - 统计: guide/statistics.md
      - 配置: guide/settings.md
      - 检索式生成: guide/retrieval.md
      - 人工复筛与 CSV 导入: guide/manual-review.md
      - 页面帮助: guide/page-help.md
  - 原理与参考:
      - 产品概述与动机: reference/product.md
      - 目标与边界: reference/scope.md
      - 流水线与数据流: reference/pipeline.md
      - 工作区与配置: reference/workspace.md
      - 数据库: reference/database.md
  - 开发与进度:
      - 架构总览: develop/architecture.md
      - 多端策略: develop/platforms.md
      - 路线图: develop/roadmap.md
      - 功能备忘: develop/backlog.md

copyright: Copyright &copy; 2026 LitNexus
